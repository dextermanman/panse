name: 판세 갱신
on:
  push:
    branches: [ main ]
  schedule:
    # 15분 주기 다중 크론 트리거 (스케줄러 큐 지연 및 누락 방지)
    - cron: "*/15 * * * *"
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:  # 수동 실행 버튼
  repository_dispatch: # 외부 웹훅 트리거 (cron-job.org 등)
    types: [ update, refresh ]

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: 뉴스·시세 수집
        run: python3 fetch_news.py
      
      - name: 페이지 렌더
        run: |
          python3 render.py
          mkdir -p public
          cp dashboard.html public/index.html
      
      - name: surge 배포 (최대 3회 재시도)
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          for i in 1 2 3; do
            if npx --yes surge ./public --domain "$(cat public/CNAME)"; then
              echo "Surge 배포 성공"
              exit 0
            fi
            echo "Surge 배포 재시도 ($i)..."
            sleep 3
          done
          exit 1

      - name: 저장소 활성 상태 유지 및 시세 이력 보관
        continue-on-error: true
        run: |
          git config user.name "판세 봇"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .last_heartbeat
          cp market_history.json /tmp/mine.json 2>/dev/null || true
          for i in 1 2 3; do
            git add .last_heartbeat market_history.json
            if git diff --staged --quiet; then echo "변경 없음"; exit 0; fi
            git commit -q -m "판세 자동 갱신 및 시세 이력 보관 [skip ci]"
            if git push -q origin HEAD:main 2>/dev/null; then echo "저장 완료"; exit 0; fi
            echo "원격이 앞섬 — 이력 병합 후 재시도 ($i)"
            git fetch -q origin main
            git reset -q --hard origin/main
            python3 - <<'PYEOF'
          import json
          def load(p):
              try:
                  with open(p) as f:
                      return json.load(f)
              except Exception:
                  return []
          merged = {h["ts"]: h for h in load("market_history.json") + load("/tmp/mine.json")}
          with open("market_history.json", "w") as f:
              json.dump([merged[k] for k in sorted(merged)], f)
          PYEOF
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .last_heartbeat
          done
