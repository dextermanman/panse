name: 판세 갱신

on:
  push:
    branches: [ main ]
  schedule:
    # 매시 정각과 30분에 갱신되도록 3분 앞당겨 잡는다.
    # 정각 직후는 GitHub Actions 혼잡 구간이라 예약이 밀리므로
    # (문서: High load times include the start of every hour) 정각을 피한다.
    -     - cron: "2,17,32,47 * * * *"
  workflow_dispatch:  # 수동 실행 버튼

permissions:
  contents: write  # 시세 이력을 커밋해 두기 위해 필요

concurrency:
  group: update
  cancel-in-progress: false  # 배포 도중 잘리면 그 주기 갱신이 통째로 누락된다

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 뉴스·시세 수집
        run: python3 fetch_news.py

      - name: 페이지 렌더
        run: |
          python3 render.py
          mkdir -p public
          cp dashboard.html public/index.html

      - name: surge 배포
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          npx --yes surge ./public --domain "$(cat public/CNAME)"

      - name: 시세 이력 보관
        # 러너는 매번 새로 만들어지므로 24시간 등락률 계산용 이력을
        # 저장소에 되돌려 놓는다. 실행이 겹치면 같은 JSON에 서로 다른
        # 표본이 붙어 rebase가 충돌하므로, 충돌 시 두 이력을 ts 기준으로
        # 합쳐서 다시 시도한다. 끝내 실패해도 배포는 이미 끝났으므로
        # 워크플로를 실패로 만들지 않는다.
        continue-on-error: true
        run: |
          git config user.name "판세 봇"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp market_history.json /tmp/mine.json
          for i in 1 2 3; do
            git add market_history.json
            if git diff --staged --quiet; then echo "변경 없음"; exit 0; fi
            git commit -q -m "시세 이력 갱신 [skip ci]"
            if git push -q origin HEAD:main 2>/dev/null; then echo "저장 완료"; exit 0; fi
            echo "원격이 앞섬 — 이력 병합 후 재시도 ($i)"
            git fetch -q origin main
            git reset -q --hard origin/main
            python3 - <<'PYEOF'
          import json
          def load(p):
              try:
                  with open(p) as f:
                      return json.load(f)
              except Exception:
                  return []
          merged = {h["ts"]: h for h in load("market_history.json") + load("/tmp/mine.json")}
          with open("market_history.json", "w") as f:
              json.dump([merged[k] for k in sorted(merged)], f)
          PYEOF
          done
          echo "이력 저장 실패 — 다음 실행에서 재시도"
