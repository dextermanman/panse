name: 판세 갱신

on:
  schedule:
    # 15분 간격 4회 시도 — GitHub 스케줄러 지연/드롭 대비 오버샘플링
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:  # 수동 실행 버튼

permissions:
  contents: write  # 시세 이력을 커밋해 두기 위해 필요

concurrency:
  group: update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 뉴스·시세 수집
        run: python3 fetch_news.py

      - name: 페이지 렌더
        run: |
          python3 render.py
          mkdir -p public
          cp dashboard.html public/index.html

      - name: surge 배포
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          npx --yes surge ./public --domain "$(cat public/CNAME)"

      - name: 시세 이력 보관
        run: |
          git config user.name "판세 봇"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market_history.json
          if ! git diff --staged --quiet; then
            git commit -m "시세 이력 갱신 [skip ci]"
            git pull --rebase origin main || true
            git push
          fi
